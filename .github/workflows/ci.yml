name: PowerShell smoke checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts without executing an installer
        shell: powershell
        run: |
          .\tests\smoke.ps1
          .\scripts\install.ps1 -WhatIf
